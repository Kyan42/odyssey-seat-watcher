name: Watch Odyssey 70mm seats

on:
  schedule:
    # Every 15 minutes, offset off the hour to dodge GitHub's top-of-hour queue.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

concurrency:
  group: seat-watch
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Check seat maps
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python3 watch.py

      - name: Persist alert state
        if: always()
        run: |
          if [[ -n "$(git status --porcelain state.json)" ]]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state.json
            git commit -m "state: seat availability changed [skip ci]"
            git push
          else
            echo "No state change."
          fi
