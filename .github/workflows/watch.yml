name: Watch Odyssey 70mm seats

on:
  schedule:
    # Every 15 minutes, offset off the hour to dodge GitHub's top-of-hour queue.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      force_zone:
        description: 'Widen the target zone to force an alert, e.g. "A:1-39". Leave blank for a normal run.'
        required: false
        default: ""

concurrency:
  group: seat-watch
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Check seat maps
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          FORCE_ZONE: ${{ inputs.force_zone }}
        run: python3 watch.py

      - name: Persist alert state
        if: always() && !inputs.force_zone
        run: |
          if [[ -n "$(git status --porcelain state.json)" ]]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state.json
            git commit -m "state: seat availability changed [skip ci]"
            git push
          else
            echo "No state change."
          fi
