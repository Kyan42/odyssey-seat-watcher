name: watch-a

# Half of the self-sustaining pair: finishing here starts watch-b, and watch-b
# finishing starts this again. The schedule is only a recovery net in case the
# chain is ever broken.

on:
  schedule:
    # Sparse: a chain is worth ~16 hours, and frequent triggers just pile up in
    # the concurrency queue and cancel each other.
    - cron: "17 */2 * * *"
  workflow_dispatch:
    inputs:
      force_zone:
        description: 'Widen the target zone to force an alert, e.g. "A:1-39". Leave blank for a normal run.'
        required: false
        default: ""
      loop_minutes:
        description: "How long this run should keep polling for."
        required: false
        default: "330"
  workflow_run:
    workflows: [watch-b]
    types: [completed]

# A called workflow cannot request more than its caller holds, and this repo
# defaults the token to read-only.
permissions:
  contents: read
  actions: write

jobs:
  watch:
    # A cancelled run must not hand off, or every superseded queue entry spawns
    # a fresh run that is itself immediately superseded.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion != 'cancelled'
    uses: ./.github/workflows/seat-watch.yml
    with:
      force_zone: ${{ inputs.force_zone || '' }}
      loop_minutes: ${{ inputs.loop_minutes || '330' }}
    secrets: inherit
