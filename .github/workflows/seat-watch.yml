name: seat-watch

# Shared implementation. Called by watch-a and watch-b, which re-trigger each
# other on completion so the watcher keeps itself alive without depending on
# GitHub's cron (which drops the large majority of scheduled triggers).
#
# GitHub caps workflow_run chains at three levels, so each link runs for 5.5
# hours: one trigger buys roughly 16 hours of cover.

on:
  workflow_call:
    inputs:
      force_zone:
        type: string
        default: ""
      loop_minutes:
        type: string
        default: "330"

concurrency:
  group: seat-watch
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v4

      - name: Note start time
        id: t0
        run: echo "epoch=$(date +%s)" >> "$GITHUB_OUTPUT"

      # Optional hardening. GitHub blocks GITHUB_TOKEN from triggering
      # workflows, so without a PAT we fall back on the (capped) workflow_run
      # chain plus cron. With one, every run explicitly queues its successor.
      # Queuing happens up front, not at the end, so the successor is already
      # waiting in the concurrency group even if this run crashes or times out.
      - name: Queue the next run
        if: ${{ !inputs.force_zone }}
        env:
          GH_TOKEN: ${{ secrets.WATCHER_PAT }}
        run: |
          if [ -z "${GH_TOKEN}" ]; then
            echo "No WATCHER_PAT secret set - relying on the workflow_run chain and cron."
            exit 0
          fi
          if gh workflow run watch-a.yml --repo "${{ github.repository }}"; then
            echo "Successor queued; it will start as soon as this run ends."
          else
            echo "Could not queue a successor (workflow disabled?) - not fatal."
          fi

      # State lives in the Actions cache, not a commit: pushing to the default
      # branch makes GitHub re-register the cron schedule.
      - name: Restore alert state
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: seat-state-${{ github.run_id }}
          restore-keys: seat-state-

      - name: Watch seat maps
        id: watch
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          FORCE_ZONE: ${{ inputs.force_zone }}
          LOOP_MINUTES: ${{ inputs.loop_minutes }}
          POLL_SECONDS: "300"
        run: python3 watch.py

      - name: Save alert state
        if: always() && !inputs.force_zone
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: seat-state-${{ github.run_id }}

      - name: Shut the watcher down once the shows have passed
        if: steps.watch.outputs.expired == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for wf in watch-a.yml watch-b.yml; do
            gh api -X PUT "repos/${{ github.repository }}/actions/workflows/$wf/disable"
            echo "Disabled $wf"
          done

      # Each run re-triggers its partner, so a run that dies immediately would
      # spin the chain. Never let a chained run finish in under 10 minutes.
      - name: Guard against a hot restart loop
        if: always() && github.event_name == 'workflow_run'
        run: |
          floor=600
          elapsed=$(( $(date +%s) - ${{ steps.t0.outputs.epoch }} ))
          if [ "$elapsed" -lt "$floor" ]; then
            echo "Only ran for ${elapsed}s, padding to ${floor}s before restarting the chain."
            sleep $(( floor - elapsed ))
          fi
