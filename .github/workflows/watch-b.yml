name: watch-b

# The other half of the pair. See watch-a.

on:
  schedule:
    - cron: "47 1-23/2 * * *"
  workflow_dispatch:
  workflow_run:
    workflows: [watch-a]
    types: [completed]

permissions:
  contents: read
  actions: write

jobs:
  watch:
    # See watch-a.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion != 'cancelled'
    uses: ./.github/workflows/seat-watch.yml
    with:
      loop_minutes: "330"
    secrets: inherit
